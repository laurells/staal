[package]
name = "staalc"
version = "0.22.0"
edition = "2024"
rust-version = "1.89"
description = "The Staal compiler and reference runtime"
repository = "https://github.com/laurells/staal"
readme = "README.md"
publish = false

[lib]
# rlib for the command line and tests; cdylib for the C interface (src/capi.rs),
# which other languages load as libstaalc.so / libstaalc.dylib;
# staticlib: the runtime `staalc build` links into each executable.
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
# Standard base64 (RFC 4648), strict on decoding, for `base64_encode`/`base64_decode`.
base64 = "0.23.1"
getrandom = "0.4.3"
libc = "0.2.191"
# SQLite for the `db.sqlite` capabilities, built from its own source (bundled) so
# every platform runs the same version; `limits` to forbid ATTACH.
rusqlite = { version = "0.41.0", features = ["bundled", "limits"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
# HTTP client for `net.http`, TLS through rustls with the ring provider and the
# Mozilla root certificates (webpki-roots). No compression, cookies or proxies.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
url = "2.5.8"
# The TLS library ureq uses, named directly to recognise handshake errors
# (src/interp/http.rs) and for `net.tls` (src/interp/tcp.rs); the same version and
# the same ring provider ureq uses.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }
# Mozilla root certificates as certificates, so an operator can add a root on top of
# them (net.extra_root_certificates). The same 1.0.9 snapshot ureq uses by default.
webpki-root-certs = "1.0.9"

# Native code for pure functions (src/native.rs): Cranelift, JIT-compiled at load.
# Exact versions; 0.136.2 rather than 0.136.3, which was under two weeks old.
cranelift-codegen = { version = "=0.136.2", optional = true }
cranelift-frontend = { version = "=0.136.2", optional = true }
cranelift-jit = { version = "=0.136.2", optional = true }
cranelift-module = { version = "=0.136.2", optional = true }
cranelift-native = { version = "=0.136.2", optional = true }
# Object files for `staalc build` (ahead-of-time executables).
cranelift-object = { version = "=0.136.2", optional = true }

[features]
default = ["native"]
native = ["dep:cranelift-codegen", "dep:cranelift-frontend", "dep:cranelift-jit", "dep:cranelift-module", "dep:cranelift-native", "dep:cranelift-object"]
# Test-only crash injection for the journal (src/interp/journal.rs). Never enable in
# a production build.
failpoints = []

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem", "crypto"] }
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std"] }

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "staal"
# The same as staalc's own version (Cargo.toml); a test keeps them equal.
version = "0.25.0"
description = "Staal, the programming language for agents: the staalc compiler and runtime, and a Python interface to it"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0 WITH LLVM-exception" }
keywords = ["staal", "programming language", "compiler", "ai", "agents", "capabilities"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Compilers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
]

[project.optional-dependencies]
# Adapters for agent frameworks: staal.openai_agents, staal.langgraph and
# staal.claude_agent_sdk. The core package needs none of them.
openai-agents = ["openai-agents>=0.24.0"]
langgraph = ["langgraph>=1.2.16", "langchain-core>=1.6.12"]
claude-agent-sdk = ["claude-agent-sdk>=0.2.168"]

[project.urls]
Homepage = "https://laurells.github.io/staal/"
Source = "https://github.com/laurells/staal"
Issues = "https://github.com/laurells/staal/issues"
Documentation = "https://github.com/laurells/staal/blob/main/docs/GUIDE.md"

[project.scripts]
staalc = "staal._cli:main"

[tool.setuptools]
packages = ["staal"]

[tool.setuptools.package-data]
staal = ["_bin/*"]

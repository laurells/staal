# Uploads a release's Python wheels to PyPI and its npm package to npm, when the
# draft release that release.yml made is published (or by hand, for a tag). It
# uploads the files on the GitHub release itself, the ones CI built and tested, and
# builds nothing.
#
# Both use trusted publishing (OpenID Connect), so no token is stored anywhere.
# PyPI, once: pypi.org, Account settings, Publishing, add a pending publisher:
# project staal, owner laurells, repository staal, workflow publish.yml, environment
# pypi. npm, once, after the package's first version is published by hand (npm
# needs the package to exist): npmjs.com, the @staal/node package, Settings, Trusted
# Publisher, GitHub Actions: owner laurells, repository staal, workflow publish.yml,
# environment npm. A version already on either registry is left as it is.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.23.0
        required: true
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The release's wheels
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'staal-*.whl' --dir dist
          ls dist
          version="${TAG#v}"
          for f in dist/*.whl; do case "$f" in "dist/staal-$version-"*) ;; *) echo "$f is not version $version"; exit 1 ;; esac; done
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          skip-existing: true
  npm:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          # No registry-url: with one, setup-node writes an .npmrc that sends a
          # placeholder token, and npm then skips trusted publishing.
          node-version: "22"
      - name: The release's npm package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "staal-node-$version.tgz" --dir dist
          ls dist
      # Trusted publishing needs npm 11.5.1 or later, and no NODE_AUTH_TOKEN at all:
      # even an empty one makes npm skip it.
      - name: npm that supports trusted publishing
        run: npm install -g npm@11.21.1
      - name: Publish
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          if npm view "@staal/node@$version" version >/dev/null 2>&1; then
            echo "@staal/node $version is already on npm; nothing to do"
          else
            # "./": without it npm reads dist/<file> as a GitHub repository, owner "dist".
            npm publish "./dist/staal-node-$version.tgz" --access public --provenance
          fi

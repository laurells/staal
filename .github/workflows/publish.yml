# Uploads a release's Python wheels to PyPI and its npm package to npm, when the
# draft release that release.yml made is published (or by hand, for a tag). It
# uploads the files on the GitHub release itself, the ones CI built and tested, and
# builds nothing.
#
# PyPI: trusted publishing, so no token is stored. Once, on pypi.org: Account
# settings, Publishing, add a pending publisher: project staal, owner laurells,
# repository staal, workflow publish.yml, environment pypi.
# npm: an automation token from npmjs.com in the repository secret NPM_TOKEN, used
# only by the npm environment.
name: publish
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: The release's tag, such as v0.23.0
        required: true
permissions:
  contents: read
jobs:
  pypi:
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - name: The release's wheels
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'staal-*.whl' --dir dist
          ls dist
          version="${TAG#v}"
          for f in dist/*.whl; do case "$f" in "dist/staal-$version-"*) ;; *) echo "$f is not version $version"; exit 1 ;; esac; done
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
  npm:
    runs-on: ubuntu-24.04
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: The release's npm package
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          version="${TAG#v}"
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "staal-$version.tgz" --dir dist
          ls dist
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/staal-*.tgz --access public --provenance

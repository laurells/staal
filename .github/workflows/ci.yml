# Builds and tests staalc on Linux (x86_64 and arm64) and macOS: macos-15 is Apple
# Silicon (arm64), macos-15-intel is Intel (x86_64; GitHub supports it until the macOS
# 15 image retires).
# Everything in `cargo test`, with crash injection, plus the build without native code.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.97.0 --component clippy
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          else
            rustup toolchain install 1.97.0 --profile minimal --component clippy && rustup default 1.97.0
          fi
      - name: PostgreSQL for the db.postgres tests on Linux, where the image has none
        if: runner.os == 'Linux'
        run: test -d /usr/lib/postgresql || { sudo apt-get update -q && sudo apt-get install -y -q postgresql; }
      - name: PostgreSQL for the db.postgres tests (Homebrew on macOS)
        if: runner.os == 'macOS'
        run: brew install postgresql@16 && echo "STAAL_POSTGRES_BIN=$(brew --prefix postgresql@16)/bin" >> "$GITHUB_ENV"
      - name: Versions
        run: rustc --version && cargo --version && git --version && python3 --version && node --version
      - name: Tests, with crash injection
        env:
          STAAL_REQUIRE_EVERY_LICENCE_TARGET: "1"
        run: cargo test --features failpoints --no-fail-fast
      - name: Tests without native code
        run: cargo test --no-default-features --no-fail-fast
      - name: VS Code extension (grammar, client, and the server through VS Code's protocol library)
        working-directory: editors/vscode
        run: npm ci && npm test
      - name: Python wheel, installed and used with no Rust
        run: |
          python3 -m venv "$RUNNER_TEMP/pyenv"
          "$RUNNER_TEMP/pyenv/bin/pip" install --quiet build setuptools wheel
          if [ "$(uname -s)" = Linux ]; then "$RUNNER_TEMP/pyenv/bin/pip" install --quiet auditwheel patchelf; fi
          PYTHON="$RUNNER_TEMP/pyenv/bin/python" scripts/wheel.sh "$RUNNER_TEMP/wheels"
          scripts/wheel_test.sh "$RUNNER_TEMP"/wheels/*.whl "$RUNNER_TEMP/wheel-test"
      - name: Node package (tests with crash injection, types, then packed, installed and tested again)
        if: runner.os == 'Linux'
        working-directory: node
        run: |
          cargo build --locked --features failpoints
          cp target/debug/libstaal_node.so "$RUNNER_TEMP/staal-fp.node"
          npm ci
          STAAL_NODE_ADDON="$RUNNER_TEMP/staal-fp.node" STAAL_CRASH_ADDON="$RUNNER_TEMP/staal-fp.node" STAAL_HAS_NATIVE=1 npm test
          npm run types
          cargo clippy --locked -- -D warnings
          ../scripts/node_package.sh "$RUNNER_TEMP/npm"
          mkdir "$RUNNER_TEMP/npm-app"
          (cd "$RUNNER_TEMP/npm-app" && npm init -y >/dev/null && npm install "$RUNNER_TEMP"/npm/staal-node-*.tgz)
          STAAL_PACKAGE="$RUNNER_TEMP/npm-app/node_modules/@staal/node" STAAL_CRASH_ADDON="$RUNNER_TEMP/staal-fp.node" STAAL_HAS_NATIVE=1 node --test test/staal.test.mjs
      - name: Clippy
        run: cargo clippy --all-targets --features failpoints -- -D warnings
